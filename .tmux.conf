# Splitting panes with | and -
# https://www.golinuxcloud.com/tmux-config/
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Change select-pane key bindings to be like vim
# https://stackoverflow.com/a/46124522/2179970
bind-key k  select-pane -U
bind-key j  select-pane -D
bind-key h  select-pane -L
bind-key l  select-pane -R

# Setup easy copy/paste
# https://dev.to/iggredible/the-easy-way-to-copy-text-in-tmux-319g
setw -g mode-keys vi

# Increase scrollback limit
# Default is 2000
# https://stackoverflow.com/questions/18760281/how-do-i-increase-the-scrollback-buffer-size-in-tmux
set-option -g history-limit 10000

# Unbind the annoying suspend key binding (ctrl+z) that causes so many accidents when trying to zoom
unbind-key C-z

# Set ctrl+z as the key binding for zoom
bind-key C-z resize-pane -Z

# Disambiguate which pane is active with >2 panes: arrow markers point into the active pane,
# instead of relying on shared-border color which is ambiguous past a 2-pane layout
set-option -g pane-border-indicators arrows

# Claude shift+enter additions
# https://gist.github.com/jftuga/ffa03dbf4cd818f00cc32ce4186d6c1c
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# Mouse
set -g mouse on

# Tmux Session Save/Restore
# Requires tpm installed first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# Initialize tpm (must be at the very bottom of the file)
run '~/.tmux/plugins/tpm/tpm'
